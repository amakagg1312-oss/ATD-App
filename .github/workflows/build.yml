name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Create the GitHub release first so both build runners can upload to it ─
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --draft \
            --generate-notes \
            || echo "Release already exists, continuing"

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest      # Apple Silicon — builds BOTH x64 + arm64 DMGs
            platform: mac         # x64 uses Rosetta for Python package install

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ── Windows: embeddable Python 3.12 + packages ──────────────────────
      - name: Bundle Python (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = "frontend\resources\python"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          $downloaded = $false
          foreach ($pyVer in @("3.12.10", "3.12.9", "3.12.8")) {
            $url = "https://www.python.org/ftp/python/$pyVer/python-$pyVer-embed-amd64.zip"
            try {
              Invoke-WebRequest -Uri $url -OutFile py-embed.zip -ErrorAction Stop
              Write-Output "Using Python $pyVer"
              $downloaded = $true
              break
            } catch { Write-Output "Not found: $pyVer, trying next..." }
          }
          if (-not $downloaded) { throw "Could not download any Python 3.12.x embeddable" }

          Expand-Archive py-embed.zip -DestinationPath $dest -Force
          $pth = Get-ChildItem $dest -Filter "python31*._pth" | Select-Object -First 1
          (Get-Content $pth.FullName) -replace '#import site','import site' | Set-Content $pth.FullName

          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile get-pip.py
          & "$dest\python.exe" get-pip.py --no-warn-script-location
          & "$dest\python.exe" -m pip install nba_api openpyxl pandas scikit-learn --no-warn-script-location
          Write-Output "Python bundle complete"

      # ── macOS: download both arch Pythons, use Rosetta for x64 pip ──────
      # Single macos-latest (arm64) runner builds both x64 and arm64 DMGs.
      # Rosetta 2 is pre-installed on GitHub's Apple Silicon runners, so
      # "arch -x86_64 python3.12" runs the x64 binary to install x64 packages.
      - name: Bundle Python (macOS — both architectures)
        if: runner.os == 'macOS'
        run: |
          set -e
          mkdir -p frontend/resources

          download_python() {
            local PBS_ARCH=$1   # x86_64 or aarch64
            local OUT_DIR=$2    # destination folder
            local DOWNLOADED=false

            for TAG in 20250316 20250212 20241219 20241010; do
              for PY_VER in "3.12.9" "3.12.8"; do
                URL="https://github.com/astral-sh/python-build-standalone/releases/download/${TAG}/cpython-${PY_VER}+${TAG}-${PBS_ARCH}-apple-darwin-install_only.tar.gz"
                echo "  Trying ${PBS_ARCH} Python ${PY_VER} (${TAG})..."
                if curl -fsSL --retry 2 --max-time 120 -o /tmp/py_dl.tar.gz "$URL" 2>/dev/null; then
                  if tar -xzf /tmp/py_dl.tar.gz -C /tmp/py_extract 2>/dev/null && [ -d "/tmp/py_extract/python/bin" ]; then
                    mv /tmp/py_extract/python "$OUT_DIR"
                    rm -rf /tmp/py_extract /tmp/py_dl.tar.gz
                    echo "  Downloaded: ${PBS_ARCH} Python ${PY_VER}"
                    DOWNLOADED=true
                    break 2
                  fi
                fi
                rm -rf /tmp/py_extract /tmp/py_dl.tar.gz
              done
            done
            [ "$DOWNLOADED" = "true" ] || (echo "ERROR: failed to download ${PBS_ARCH} Python" && exit 1)
          }

          mkdir -p /tmp/py_extract

          # arm64 Python — runs natively
          echo "==> arm64 Python"
          download_python "aarch64" "frontend/resources/python-mac-arm64"
          frontend/resources/python-mac-arm64/bin/pip3 install --quiet \
            nba_api openpyxl pandas scikit-learn requests
          echo "arm64 Python ready"

          # x64 Python — use Rosetta (arch -x86_64) to run the x64 binary for pip
          echo "==> x64 Python"
          download_python "x86_64" "frontend/resources/python-mac-x64"
          arch -x86_64 frontend/resources/python-mac-x64/bin/python3.12 -m pip install --quiet \
            nba_api openpyxl pandas scikit-learn requests
          echo "x64 Python ready"

          echo "==> Both Mac Python bundles complete"
          ls frontend/resources/python-mac-arm64/bin/
          ls frontend/resources/python-mac-x64/bin/

      # ── Bundle project data files ────────────────────────────────────────
      - name: Bundle data files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "frontend\resources\data" | Out-Null
          foreach ($d in @("NBA Site data", "Player Roles", "Playbook", "nba2k26_generator")) {
            if (Test-Path $d) { Copy-Item -Recurse -Force $d "frontend\resources\data\"; Write-Output "Copied: $d" }
          }

      - name: Bundle data files (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p frontend/resources/data
          for dir in "NBA Site data" "Player Roles" "Playbook" "nba2k26_generator"; do
            [ -d "$dir" ] && cp -r "$dir" frontend/resources/data/ && echo "Copied: $dir" || true
          done

      # ── Set package.json version from git tag ───────────────────────────
      - name: Set version from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME:-}"
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
            node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('frontend/package.json','utf8')); p.version='$VERSION'; fs.writeFileSync('frontend/package.json',JSON.stringify(p,null,2)+'\n')"
            echo "Set version to $VERSION"
          else
            echo "Not a version tag, skipping"
          fi

      # ── Node deps ────────────────────────────────────────────────────────
      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      # ── Generate placeholder icons (skipped if real icons already exist) ─
      - name: Create icons (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/make_icons.py frontend\build-assets

      - name: Create icons (macOS)
        if: runner.os == 'macOS'
        run: python3 scripts/make_icons.py frontend/build-assets

      # ── Electron-builder: build & upload to existing draft release ───────
      - name: Build & publish (Windows)
        if: runner.os == 'Windows'
        working-directory: frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win

      - name: Build & publish (macOS)
        if: runner.os == 'macOS'
        working-directory: frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist:mac

      # ── Upload artifacts ─────────────────────────────────────────────────
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ATD-2K26-${{ matrix.os }}
          path: |
            frontend/dist/*.exe
            frontend/dist/*.dmg
            frontend/dist/*.zip
            frontend/dist/latest*.yml
          if-no-files-found: warn

  # ── Promote draft to published release once both builds succeed ──────────
  publish-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false
