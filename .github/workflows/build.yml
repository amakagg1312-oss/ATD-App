name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # ── Windows: embeddable Python 3.12 + packages ──────────────────────
      - name: Bundle Python (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = "frontend\resources\python"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null

          $downloaded = $false
          foreach ($pyVer in @("3.12.10", "3.12.9", "3.12.8")) {
            $url = "https://www.python.org/ftp/python/$pyVer/python-$pyVer-embed-amd64.zip"
            try {
              Invoke-WebRequest -Uri $url -OutFile py-embed.zip -ErrorAction Stop
              Write-Output "Using Python $pyVer"
              $downloaded = $true
              break
            } catch { Write-Output "Not found: $pyVer, trying next..." }
          }
          if (-not $downloaded) { throw "Could not download any Python 3.12.x embeddable" }

          Expand-Archive py-embed.zip -DestinationPath $dest -Force
          $pth = Get-ChildItem $dest -Filter "python31*._pth" | Select-Object -First 1
          (Get-Content $pth.FullName) -replace '#import site','import site' | Set-Content $pth.FullName

          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile get-pip.py
          & "$dest\python.exe" get-pip.py --no-warn-script-location
          & "$dest\python.exe" -m pip install nba_api openpyxl pandas --no-warn-script-location
          Write-Output "Python bundle complete"

      # ── macOS: python-build-standalone (truly portable) ─────────────────
      - name: Bundle Python (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          mkdir -p frontend/resources
          ARCH=$(uname -m)
          DOWNLOADED=false

          for TAG in 20250316 20250212 20241219 20241010; do
            for PY_VER in "3.12.9" "3.12.8"; do
              if [ "$ARCH" = "arm64" ]; then
                URL="https://github.com/astral-sh/python-build-standalone/releases/download/${TAG}/cpython-${PY_VER}+${TAG}-aarch64-apple-darwin-install_only.tar.gz"
              else
                URL="https://github.com/astral-sh/python-build-standalone/releases/download/${TAG}/cpython-${PY_VER}+${TAG}-x86_64-apple-darwin-install_only.tar.gz"
              fi
              echo "Trying: $URL"
              if curl -fL --retry 2 --max-time 120 -o /tmp/py_standalone.tar.gz "$URL" 2>/dev/null; then
                if file /tmp/py_standalone.tar.gz | grep -q "gzip\|tar"; then
                  if tar -xzf /tmp/py_standalone.tar.gz -C frontend/resources 2>/dev/null; then
                    if [ -d "frontend/resources/python/bin" ]; then
                      echo "Success: Python ${PY_VER} from tag ${TAG}"
                      DOWNLOADED=true
                      break 2
                    fi
                  fi
                fi
              fi
              echo "  -> Not available, trying next..."
              rm -f /tmp/py_standalone.tar.gz
            done
          done

          [ "$DOWNLOADED" = "true" ] || (echo "ERROR: all downloads failed" && exit 1)

          rm -f /tmp/py_standalone.tar.gz
          ls frontend/resources/python/bin/
          frontend/resources/python/bin/pip3 install nba_api openpyxl pandas
          echo "Python bundle complete"

      # ── Bundle project data files ────────────────────────────────────────
      - name: Bundle data files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "frontend\resources\data" | Out-Null
          foreach ($d in @("NBA Site data", "Player Roles", "Playbook", "nba2k26_generator")) {
            if (Test-Path $d) { Copy-Item -Recurse -Force $d "frontend\resources\data\"; Write-Output "Copied: $d" }
          }

      - name: Bundle data files (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p frontend/resources/data
          for dir in "NBA Site data" "Player Roles" "Playbook" "nba2k26_generator"; do
            [ -d "$dir" ] && cp -r "$dir" frontend/resources/data/ && echo "Copied: $dir" || true
          done

      # ── Set package.json version from git tag ───────────────────────────
      - name: Set version from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME:-}"
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VERSION="${BASH_REMATCH[1]}"
            node -e "const fs=require('fs'),p=JSON.parse(fs.readFileSync('frontend/package.json','utf8')); p.version='$VERSION'; fs.writeFileSync('frontend/package.json',JSON.stringify(p,null,2)+'\n')"
            echo "Set version to $VERSION"
          else
            echo "Not a version tag, skipping"
          fi

      # ── Node deps ────────────────────────────────────────────────────────
      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci

      # ── Generate placeholder icons (skipped if real icons already exist) ─
      - name: Create icons (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/make_icons.py frontend\build-assets

      - name: Create icons (macOS)
        if: runner.os == 'macOS'
        run: python3 scripts/make_icons.py frontend/build-assets

      # ── Electron-builder: build & publish to GitHub Release ──────────────
      - name: Build & publish
        working-directory: frontend
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run dist

      # ── Upload artifacts ─────────────────────────────────────────────────
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ATD-2K26-${{ matrix.os }}
          path: |
            frontend/dist/*.exe
            frontend/dist/*.dmg
            frontend/dist/*.zip
            frontend/dist/latest*.yml
          if-no-files-found: warn
